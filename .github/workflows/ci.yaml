name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: campushub_test
          POSTGRES_PASSWORD: local_ci_password
          POSTGRES_DB: campushub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campushub_test -d campushub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            echo "Run gofmt -w on the listed files."
            exit 1
          fi

      - name: Vet packages
        run: go vet ./...

      - name: Test with race detection and coverage
        env:
          TEST_DATABASE_URL: postgresql://campushub_test:local_ci_password@127.0.0.1:5432/campushub_test?sslmode=disable
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...

      - name: Build packages
        run: go build ./...

  docker:
    name: Docker build
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build --tag campushub-api:ci .
