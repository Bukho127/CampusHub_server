name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: campushub_test
          POSTGRES_PASSWORD: local_ci_password
          POSTGRES_DB: campushub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campushub_test -d campushub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            echo "Run gofmt -w on the listed files."
            exit 1
          fi

      - name: Vet packages
        run: go vet ./...

      - name: Install FFmpeg for image processing tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test with race detection and coverage
        env:
          TEST_DATABASE_URL: postgresql://campushub_test:local_ci_password@127.0.0.1:5432/campushub_test?sslmode=disable
          REQUIRE_FFMPEG_TESTS: "1"
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...

      - name: Build packages
        run: go build ./...

  docker:
    name: Docker build (${{ matrix.component }})
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [api, valkey]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        env:
          COMPONENT: ${{ matrix.component }}
        run: docker build --pull --target "$COMPONENT" --tag "campushub-${COMPONENT}:ci" .

  docker_build:
    # Keep the check name used by branch protection stable as the matrix changes.
    name: Docker build
    needs: [go, docker]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require Go checks and both image builds to succeed
        env:
          GO_RESULT: ${{ needs.go.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          if [ "$GO_RESULT" != "success" ] || [ "$DOCKER_RESULT" != "success" ]; then
            echo "Go checks: $GO_RESULT; Docker builds: $DOCKER_RESULT"
            exit 1
          fi
          echo "Go checks and both Docker image builds passed."
