# Local development service: host access is restricted to loopback in Compose.
# Password authentication is supplied by Compose from the ignored .env file.
bind 0.0.0.0
protected-mode yes
port 6379
daemonize no
dir /data
loglevel notice
logfile ""

# Queue data should survive container restarts. Keep both AOF and RDB snapshots.
# https://valkey.io/topics/persistence/
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Reject memory-growing writes at the limit rather than evict queued jobs.
# https://valkey.io/topics/lru-cache/
maxmemory 256mb
maxmemory-policy noeviction
