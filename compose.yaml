services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DB_USER: ${POSTGRES_USER:-campushub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-campushub}
      DB_SSLMODE: disable
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env before starting the API}"
      MEDIA_ENABLED: "${MEDIA_ENABLED:-false}"
      AZURE_STORAGE_ACCOUNT_NAME: "${AZURE_STORAGE_ACCOUNT_NAME:-}"
      AZURE_STORAGE_ACCOUNT_KEY: "${AZURE_STORAGE_ACCOUNT_KEY:-}"
      AZURE_STORAGE_CONTAINER_NAME: "${AZURE_STORAGE_CONTAINER_NAME:-}"
      AZURE_STORAGE_BLOB_URL: "${AZURE_STORAGE_BLOB_URL:-}"
      FFMPEG_PATH: ffmpeg
      MEDIA_COMPRESSION_THRESHOLD_BYTES: "${MEDIA_COMPRESSION_THRESHOLD_BYTES:-1048576}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campushub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-campushub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_create_users.up.sql:/docker-entrypoint-initdb.d/000001_create_users.sql:ro
      - ./migrations/000002_add_password_hash.up.sql:/docker-entrypoint-initdb.d/000002_add_password_hash.sql:ro
      - ./migrations/000003_expand_user_schema.up.sql:/docker-entrypoint-initdb.d/000003_expand_user_schema.sql:ro
      - ./migrations/000004_create_media.up.sql:/docker-entrypoint-initdb.d/000004_create_media.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
